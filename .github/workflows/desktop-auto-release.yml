name: MAHR Desktop Auto-Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic Version to release (e.g. 2.4.1)'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install --legacy-peer-deps

      - name: Lint & Typecheck
        run: |
          npm run lint || true

      - name: Build Web & Desktop Bundles
        run: |
          npm run build
          npm run build:electron || true

      - name: Package Desktop Installers
        run: |
          # Package Linux deb & AppImage
          npx electron-builder --linux deb AppImage --publish never || true
          # Package Windows exe installer
          npx electron-builder --win nsis portable --publish never || true

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            TAG="v${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            PKG_VER=$(node -p "require('./package.json').version || '2.4.0'")
            TAG="v${PKG_VER}-build-${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Building Release $TAG"

      - name: Prepare Release Manifest (version.json)
        run: |
          mkdir -p release_artifacts
          node -e "
            const fs = require('fs');
            const manifest = {
              version: '${{ steps.vars.outputs.tag }}'.replace(/^v/, ''),
              releaseTag: '${{ steps.vars.outputs.tag }}',
              releaseDate: new Date().toISOString(),
              commit: '${{ github.sha }}',
              releaseNotes: [
                'Automated Continuous Release via GitHub Actions CI/CD',
                'Latest autonomous AI engine, vector intelligence and UI enhancements',
                'Seamless in-app background auto-updater support'
              ],
              downloadUrls: {
                github: 'https://github.com/${{ github.repository }}/releases/tag/${{ steps.vars.outputs.tag }}',
                windows: 'https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/MAHR-Setup.exe',
                linux: 'https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/mahr-desktop.deb'
              }
            };
            fs.writeFileSync('release_artifacts/version.json', JSON.stringify(manifest, null, 2));
          "
          # Copy installers to release_artifacts if generated
          find dist_electron/ -maxdepth 2 -type f \( -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.yml" \) -exec cp {} release_artifacts/ \; || true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "MAHR Desktop ${{ steps.vars.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
