# ================================================================
# MAHR — God-Mode Blueprint Auto-Generator
# .github/workflows/generate-blueprint.yml
#
# Triggers on every push to `main`.
# Runs the blueprint generator and auto-commits the updated file.
#
# SETUP REQUIRED:
#   1. Go to your repo on GitHub
#   2. Settings → Actions → General → Workflow permissions
#   3. Select "Read and write permissions"
#   4. Click Save
# ================================================================

name: Generate Project Blueprint

on:
  push:
    branches:
      - main
    # Avoid re-triggering when the bot commits the blueprint itself
    paths-ignore:
      - 'project-blueprint.md'

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  generate-blueprint:
    name: Build & Commit Blueprint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write  # Required to push the updated blueprint

    steps:
      # ── 1. Checkout full history (for git log hotspots) ──────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for git hotspots analysis

      # ── 2. Set up Node.js ────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install dependencies (skip heavy optional deps) ───
      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline
        env:
          # Skip Electron download — not needed for script execution
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      # ── 4. Run the blueprint generator ───────────────────────
      - name: Generate project-blueprint.md
        run: node scripts/generate-blueprint.mjs

      # ── 5. Show a diff for visibility in CI logs ─────────────
      - name: Show diff
        run: |
          echo "=== Blueprint diff ==="
          git diff --stat project-blueprint.md || echo "(no changes)"

      # ── 6. Auto-commit & push if blueprint changed ───────────
      - name: Commit and push updated blueprint
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(blueprint): auto-update project-blueprint.md [skip ci]"
          file_pattern: project-blueprint.md
          commit_user_name: "blueprint-bot"
          commit_user_email: "blueprint-bot@users.noreply.github.com"
          commit_author: "blueprint-bot <blueprint-bot@users.noreply.github.com>"
          # Only commit if the file actually changed
          skip_dirty_check: false
