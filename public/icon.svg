<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#10172a" />
      <stop offset="60%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#cyanPurple)" stroke-width="2.5" opacity="0.4" />

  <!-- Outer Orbital Rings -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="8 12" opacity="0.35" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-dasharray="16 20" opacity="0.45" />

  <!-- Hexagonal Tech Matrix -->
  <polygon points="256,96 394,176 394,336 256,416 118,336 118,176" fill="none" stroke="url(#cyanPurple)" stroke-width="4" opacity="0.7" />

  <!-- Center Core Pulsing Orb -->
  <circle cx="256" cy="256" r="72" fill="url(#amberGlow)" filter="url(#glow)" opacity="0.85" />
  <circle cx="256" cy="256" r="44" fill="#030712" />
  <circle cx="256" cy="256" r="28" fill="#38bdf8" filter="url(#glow)" />

  <!-- MAHR Lettermark Monogram M -->
  <path d="M 212 284 L 212 228 L 256 264 L 300 228 L 300 284" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Precision Corner Crosshairs -->
  <line x1="256" y1="48" x2="256" y2="72" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <line x1="256" y1="440" x2="256" y2="464" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <line x1="48" y1="256" x2="72" y2="256" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <line x1="440" y1="256" x2="464" y2="256" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8" />
</svg>
